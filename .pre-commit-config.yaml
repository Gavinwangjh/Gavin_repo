repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix, --line-length=110]
      - id: ruff-format
        args: [--line-length=110]

  - repo: local
    hooks:
      - id: no-push-to-main
        name: Prevent direct push to main
        entry: python -c "import subprocess,sys; b=subprocess.check_output(['git','rev-parse','--abbrev-ref','HEAD']).decode().strip(); print('STOP! Do not push directly to main. Use a feature branch.') if b=='main' else None; sys.exit(1 if b=='main' else 0)"
        language: system
        stages: [pre-push]